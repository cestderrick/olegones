services:
  # Backend — Web Service (free, veille après 15min)
  - type: web
    name: olegones-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        value: CHANGE_ME_IN_RENDER_DASHBOARD
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000
    disk:
      name: olegones-data
      mountPath: /data
      sizeGB: 1

  # Frontend — Static Site (gratuit, sans veille, sans carte bancaire)
  - type: static
    name: olegones
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: out
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://olegones-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
