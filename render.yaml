services:
  - type: web
    name: olegones-backend
    env: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: ADMIN_PASSWORD
        value: CHANGE_ME_IN_RENDER_DASHBOARD
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://olegones.onrender.com
      - key: PORT
        value: 10000
    disk:
      name: olegones-data
      mountPath: /data
      sizeGB: 1

  - type: web
    name: olegones
    env: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://olegones-backend.onrender.com
      - key: PORT
        value: 3000
